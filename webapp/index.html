<!doctype html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SpotLine — demo</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="boot" style="position:fixed;inset:0;display:grid;place-items:center;background:#000">
    <i class="spin" style="color:#40C8D0;width:26px;height:26px;border-width:2.4px"></i>
</div>

<div class="app" id="app" hidden>
    <header class="hdr" id="hdr">
        <button class="hdr__ava" id="hdr-ava" aria-label="profile"></button>
        <span class="hdr__tx">
            <span class="hdr__t" id="hdr-title">SpotLine</span>
            <span class="hdr__s" id="hdr-sub"></span>
        </span>
        <span class="hdr__acts">
            <button class="hdr__b hdr__b--g" id="hdr-bell" aria-label="bell">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M12 3.2a5.9 5.9 0 0 0-5.9 5.9v3.05c0 .62-.22 1.22-.63 1.69l-.86 1a.9.9 0 0 0 .68 1.49h13.42a.9.9 0 0 0 .68-1.49l-.86-1a2.6 2.6 0 0 1-.63-1.69V9.1A5.9 5.9 0 0 0 12 3.2Z"
                          stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                    <path d="M9.7 19.1a2.4 2.4 0 0 0 4.6 0" stroke="currentColor"
                          stroke-width="1.7" stroke-linecap="round"/>
                </svg>
                <i id="hdr-dot" hidden></i>
            </button>
            <button class="hdr__b hdr__b--a" id="hdr-refresh" aria-label="refresh">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M20.2 12a8.2 8.2 0 1 1-2.42-5.8" stroke="currentColor"
                          stroke-width="1.9" stroke-linecap="round"/>
                    <path d="M20.4 3.6v4.2h-4.2" stroke="currentColor"
                          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </span>
    </header>

    <main class="screen" id="screen-cabinet"></main>
    <main class="screen" id="screen-bookings" hidden></main>
    <main class="screen" id="screen-services" hidden></main>
    <main class="screen" id="screen-contacts" hidden></main>
    <main class="screen" id="screen-report"   hidden></main>
    <main class="screen" id="screen-settings" hidden></main>

    <nav class="tabbar" id="tabbar"></nav>
</div>

<div class="sh-host" id="sh-host">
    <div class="sh__scrim" id="sh-scrim"></div>
    <section class="sh" role="dialog" aria-modal="true">
        <div class="sh__grip"></div>
        <header class="sh__h">
            <button class="sh__x" id="sh-x" aria-label="close">
                <svg viewBox="0 0 12 12" fill="none"><path d="M1.2 1.2l9.6 9.6M10.8 1.2l-9.6 9.6"
                    stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
            </button>
            <h2 class="sh__t" id="sh-t"></h2>
            <button class="sh__ok" id="sh-ok"></button>
        </header>
        <div class="sh__b" id="sh-b"></div>
    </section>
</div>

<div class="toast" id="toast"></div>

<script>window.SPOTLINE_BOT = "spotline_zone_bot";</script>
<script src="script.js"></script>
</body>
</html>
